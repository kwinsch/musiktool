[project]
name = "musiktool"
version = "0.1.0"
description = "Agent-first music library manager — organize, audit, and master collections via CLI"
readme = "README.md"
authors = [
    { name = "Kevin Bortis", email = "kevin@bortis.ch" }
]
requires-python = ">=3.13"
dependencies = [
    "blake3>=1.0",
    "mutagen>=1.47",
    "httpx>=0.27",
    "typer>=0.15",
    "pathspec>=0.12",
]

[project.scripts]
musiktool = "musiktool.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
